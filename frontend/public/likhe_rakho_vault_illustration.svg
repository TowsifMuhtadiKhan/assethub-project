    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8CECB9"/><stop offset="1" stop-color="#2EBB7B"/></linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D8C64"/><stop offset="1" stop-color="#064B40"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E4FFF0"/><stop offset="1" stop-color="#F4FFF8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#12835D" flood-opacity=".15"/></filter>
